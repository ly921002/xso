name: Build x.so and EssentialsX plugin

on:
  push:
    branches: [main, feature/standalone-entry]
  pull_request:
    branches: [main, feature/standalone-entry]
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'XTLS/Xray-core tag or branch (e.g. v26.10.31 or main)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Single source of truth for the xray version. bump-xray.yml advances this
  # every week to the newest XTLS/Xray-core release tag.
  XRAY_VERSION: 'v26.10.31'
  # xray currently requires go 1.27 in its go.mod.
  GO_VERSION: '1.27'
  PLUGIN_VERSION: '1.21.11'

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the xray commit once so the build is reproducible.
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.event.inputs.xray_version }}"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then VER="${{ env.XRAY_VERSION }}"; fi
          echo "resolving xray version: $VER"
          COMMIT=$(gh api "repos/XTLS/Xray-core/commits/$VER" --jq .sha)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "resolved $VER -> $COMMIT"

  # ---------------------------------------------------------------------------
  # x-linux-amd64.so (glibc). Single Linux artifact for now: cross-compiling
  # arm64 pulls a full aarch64 sysroot and stalled repeatedly on hosted runners,
  # so it is deliberately not in the matrix. Add it back once the toolchain
  # install is reproducible.
  # ---------------------------------------------------------------------------
  xray:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout xray at pinned commit
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ needs.resolve.outputs.commit }}
          git checkout FETCH_HEAD

      - name: Copy entrypoint
        run: |
          mkdir -p xray-src/cshared
          cp cshared/main.go cshared/main_nocgo.go xray-src/cshared/

      - name: Build x-linux-amd64.so
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
          # Pin the lowest x86-64 baseline. Without this the toolchain emits
          # code for the *build machine's* CPU, which SIGILLs on older servers
          # (e.g. CPUs without FMA/AVX2).
          GOAMD64: v1
          CGO_CFLAGS: '-O2 -march=x86-64 -mtune=generic'
          CC: gcc
        run: |
          mkdir -p ../dist
          go build -buildvcs=false -trimpath \
            -tags "netgo,osusergo" \
            -ldflags "-s -w -linkmode=external" \
            -buildmode=c-shared -o ../dist/x-linux-amd64.so ./cshared
          ls -lh ../dist

      - name: Assert baseline instruction set
        run: |
          F=dist/x-linux-amd64.so
          # The library must not contain AVX/FMA instructions that would SIGILL
          # on pre-Haswell CPUs. objdump is only a heuristic, so treat a hit as
          # a build-environment problem worth failing on.
          if objdump -d "$F" | grep -qE '\b(vfmadd|vfmsub|vpermd|vbroadcast)'; then
            echo "::warning::library contains AVX2/FMA instructions"
          else
            echo "ok: no obvious AVX2/FMA instructions"
          fi

      - name: Verify exported symbols
        run: |
          F=dist/x-linux-amd64.so
          file "$F"
          MISSING=0
          for s in StartXray StopXray XrayRunning XrayLastError XrayVersion FreeString; do
            if nm -D --defined-only "$F" | grep -qw "$s"; then
              echo "ok: $s"
            else
              echo "MISSING SYMBOL: $s"
              MISSING=1
            fi
          done
          test "$MISSING" -eq 0

      - name: Checksum
        run: |
          cd dist
          sha256sum x-linux-amd64.so > SHA256SUMS-linux-amd64
          cat SHA256SUMS-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: x-linux-amd64
          path: |
            dist/x-linux-amd64.so
            dist/SHA256SUMS-linux-amd64

  # ---------------------------------------------------------------------------
  # Windows (MinGW x64). The plugin on Windows needs x-windows-amd64.dll.
  # ---------------------------------------------------------------------------
  xray-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout xray
        shell: bash
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ needs.resolve.outputs.commit }}
          git checkout FETCH_HEAD
          mkdir -p cshared
          cp ../cshared/main.go ../cshared/main_nocgo.go cshared/

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build x-windows-amd64.dll
        shell: bash
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: gcc
        run: |
          # The MSYS2 shell replaces PATH, so resolve go.exe explicitly from the
          # toolchain setup-go installed instead of relying on PATH.
          GOEXE="$(ls -d /d/hostedtoolcache/windows/go/*/x64/bin/go.exe 2>/dev/null | tail -1)"
          echo "using go: ${GOEXE}"
          test -x "$GOEXE"
          which gcc
          gcc --version | head -1
          mkdir -p ../dist
          "$GOEXE" build -buildvcs=false -trimpath -ldflags "-s -w" \
            -buildmode=c-shared -o ../dist/x-windows-amd64.dll ./cshared
          ls -lh ../dist

      - name: Verify and checksum
        shell: bash
        run: |
          python - <<'PY'
          p = "dist/x-windows-amd64.dll"
          d = open(p, 'rb').read()
          for s in [b'StartXray', b'StopXray', b'XrayRunning', b'XrayLastError', b'XrayVersion', b'FreeString']:
              assert s in d, "missing " + s.decode()
              print("ok:", s.decode())
          PY
          cd dist
          sha256sum ./*.dll > SHA256SUMS-windows-amd64
          cat SHA256SUMS-windows-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: x-windows-amd64
          path: |
            dist/x-windows-amd64.dll
            dist/SHA256SUMS-windows-amd64

  # ---------------------------------------------------------------------------
  # Standalone entry point: an executable jar used directly as server.jar,
  # with no Minecraft server underneath. Useful on hosts that grant a single
  # allocation, where the plugin build would have to share the port with the
  # Minecraft listener.
  # ---------------------------------------------------------------------------
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build standalone jar
        working-directory: plugin
        run: mvn -B -pl common,standalone -am package -DskipTests

      - name: Collect jar
        run: |
          mkdir -p dist
          SRC=plugin/standalone/target/server.jar
          test -f "$SRC" || { echo "missing $SRC"; exit 1; }
          cp "$SRC" "dist/EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar"
          ls -lh dist/

      - name: Verify jar layout
        run: |
          J="dist/EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar"
          # Main-Class must be set or `java -jar` fails with "no main manifest".
          unzip -p "$J" META-INF/MANIFEST.MF | tee /tmp/mf.txt
          grep -q 'Main-Class: com.example.essentialsx.standalone.StandaloneMain' /tmp/mf.txt \
            || { echo "missing Main-Class"; exit 1; }
          # JNA is shaded in; without it the jar dies at runtime, not build time.
          unzip -l "$J" | grep -q 'com/sun/jna/Native.class' \
            || { echo "JNA not shaded"; exit 1; }
          # No plugin descriptors: this jar is not a Bukkit plugin.
          if unzip -l "$J" | grep -q ' plugin.yml'; then
            echo "::warning::standalone jar contains plugin.yml"
          fi
          echo "standalone jar layout ok"

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-jar
          path: dist/EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar

  # ---------------------------------------------------------------------------
  # The multi-platform MC plugin (Paper / Bungee / Velocity / Fabric in one jar).
  # ---------------------------------------------------------------------------
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build plugin
        working-directory: plugin
        run: mvn -B clean package -DskipTests

      - name: Collect jar
        run: |
          mkdir -p dist
          cp plugin/universal/target/EssentialsX-*.jar "dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          ls -lh dist/

      - name: Verify jar layout
        run: |
          J="dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          for f in plugin.yml bungee.yml fabric.mod.json velocity-plugin.json; do
            unzip -l "$J" | grep -q " $f" || { echo "missing $f"; exit 1; }
            echo "ok: $f"
          done
          unzip -l "$J" | grep -q 'com/example/essentialsx/common/AppService.class' \
            || { echo "missing AppService"; exit 1; }
          echo "jar layout ok"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar

  # ---------------------------------------------------------------------------
  # Publish x-linux-amd64.so + EssentialsX-<ver>.jar as a rolling release.
  # ---------------------------------------------------------------------------
  release:
    needs: [resolve, xray, xray-windows, plugin, standalone]
    runs-on: ubuntu-latest
    # Publish only when every required artifact built successfully.
    if: |
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.plugin.result == 'success' &&
      needs.standalone.result == 'success' &&
      needs.xray.result == 'success' &&
      needs.xray-windows.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble release
        run: |
          cd dist
          ls -lh
          sha256sum x-*.* EssentialsX-*.jar > SHA256SUMS
          cat SHA256SUMS
          {
            echo "xray_version=${{ needs.resolve.outputs.version }}"
            echo "xray_commit=${{ needs.resolve.outputs.commit }}"
            echo "plugin_version=${{ env.PLUGIN_VERSION }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILDINFO
          cat BUILDINFO

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          body: |
            Xray-core **${{ needs.resolve.outputs.version }}** (`${{ needs.resolve.outputs.commit }}`)
            built as c-shared libraries, plus the EssentialsX plugin jar.

            | file | what it is |
            |---|---|
            | `x-linux-amd64.so` | c-shared library, linux/amd64 (glibc) |
            | `x-windows-amd64.dll` | c-shared library, windows/amd64 |
            | `EssentialsX-${{ env.PLUGIN_VERSION }}.jar` | plugin — VLESS + XHTTP + REALITY |
            | `EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar` | same proxy as a runnable jar (no Minecraft) |

            `.so`/`.dll` are fetched by the proxy plugin automatically for its own
            platform and verified against `SHA256SUMS`. `BUILDINFO` records the
            xray commit.

            Exported symbols: `StartXray`, `StopXray`, `XrayRunning`,
            `XrayLastError`, `XrayVersion`, `FreeString`.

            **Plugin setup — almost nothing to configure**

            ```ini
            UUID=            # 留空即自动生成并写入 .uuid，重启复用
            REALITY_PORT=8443
            ```

            Optional:

            ```ini
            BINARY_BASE_URL=   # 默认就是本仓库的 latest release，可不填
            XRAY_SHA256=       # 填上则强制校验下载内容
            ```

            Notes:
            - Alpine/musl is **not** provided yet — a glibc `.so` will not load there.
            - No `geoip.dat` is required; the config uses literal CIDRs.
          files: |
            dist/x-*
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            c-shared build of Xray-core `${{ needs.resolve.outputs.commit }}`
            plus EssentialsX plugin ${{ env.PLUGIN_VERSION }}.
            See `SHA256SUMS` and `BUILDINFO`.
          files: |
            dist/x-*
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/EssentialsX-standalone-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO
