name: Build x.so and EssentialsX plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'XTLS/Xray-core tag or branch (e.g. v26.10.31 or main)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Single source of truth for the xray version. bump-xray.yml advances this
  # every week to the newest XTLS/Xray-core release tag.
  XRAY_VERSION: 'v26.10.31'
  # xray currently requires go 1.27 in its go.mod.
  GO_VERSION: '1.27'
  PLUGIN_VERSION: '1.21.11'

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the xray commit once so the build is reproducible.
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.event.inputs.xray_version }}"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then VER="${{ env.XRAY_VERSION }}"; fi
          echo "resolving xray version: $VER"
          COMMIT=$(gh api "repos/XTLS/Xray-core/commits/$VER" --jq .sha)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "resolved $VER -> $COMMIT"

  # ---------------------------------------------------------------------------
  # Linux glibc: amd64 (primary) and arm64.
  # ---------------------------------------------------------------------------
  xray:
    needs: resolve
    runs-on: ubuntu-latest
    # amd64 is the primary artifact; arm64 is best-effort so a flaky cross
    # toolchain install never blocks publishing what already works.
    continue-on-error: ${{ matrix.goarch != 'amd64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc: gcc
            pkg: gcc libc6-dev
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }}

      - name: Checkout xray at pinned commit
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ needs.resolve.outputs.commit }}
          git checkout FETCH_HEAD

      - name: Copy entrypoint
        run: |
          mkdir -p xray-src/cshared
          cp cshared/main.go cshared/main_nocgo.go xray-src/cshared/

      - name: Build x-linux-${{ matrix.goarch }}.so
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p ../dist
          go build -buildvcs=false -trimpath -ldflags "-s -w" \
            -buildmode=c-shared -o ../dist/x-linux-${{ matrix.goarch }}.so ./cshared
          ls -lh ../dist

      - name: Verify exported symbols
        run: |
          F=dist/x-linux-${{ matrix.goarch }}.so
          file "$F"
          MISSING=0
          for s in StartXray StopXray XrayRunning XrayLastError XrayVersion FreeString; do
            if nm -D --defined-only "$F" | grep -qw "$s"; then
              echo "ok: $s"
            else
              echo "MISSING SYMBOL: $s"
              MISSING=1
            fi
          done
          test "$MISSING" -eq 0

      - name: Checksum
        run: |
          cd dist
          sha256sum x-linux-${{ matrix.goarch }}.so > "SHA256SUMS-linux-${{ matrix.goarch }}"
          cat "SHA256SUMS-linux-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: x-linux-${{ matrix.goarch }}
          path: |
            dist/x-linux-${{ matrix.goarch }}.so
            dist/SHA256SUMS-linux-${{ matrix.goarch }}

  # ---------------------------------------------------------------------------
  # Windows (MinGW x64). The plugin on Windows needs x-windows-amd64.dll.
  # ---------------------------------------------------------------------------
  xray-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout xray
        shell: bash
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ needs.resolve.outputs.commit }}
          git checkout FETCH_HEAD
          mkdir -p cshared
          cp ../cshared/main.go ../cshared/main_nocgo.go cshared/

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build x-windows-amd64.dll
        shell: bash
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: gcc
        run: |
          # The MSYS2 shell replaces PATH, so resolve go.exe explicitly from the
          # toolchain setup-go installed instead of relying on PATH.
          GOEXE="$(ls -d /d/hostedtoolcache/windows/go/*/x64/bin/go.exe 2>/dev/null | tail -1)"
          echo "using go: ${GOEXE}"
          test -x "$GOEXE"
          which gcc
          gcc --version | head -1
          mkdir -p ../dist
          "$GOEXE" build -buildvcs=false -trimpath -ldflags "-s -w" \
            -buildmode=c-shared -o ../dist/x-windows-amd64.dll ./cshared
          ls -lh ../dist

      - name: Verify and checksum
        shell: bash
        run: |
          python - <<'PY'
          p = "dist/x-windows-amd64.dll"
          d = open(p, 'rb').read()
          for s in [b'StartXray', b'StopXray', b'XrayRunning', b'XrayLastError', b'XrayVersion', b'FreeString']:
              assert s in d, "missing " + s.decode()
              print("ok:", s.decode())
          PY
          cd dist
          sha256sum ./*.dll > SHA256SUMS-windows-amd64
          cat SHA256SUMS-windows-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: x-windows-amd64
          path: |
            dist/x-windows-amd64.dll
            dist/SHA256SUMS-windows-amd64

  # ---------------------------------------------------------------------------
  # The multi-platform MC plugin (Paper / Bungee / Velocity / Fabric in one jar).
  # ---------------------------------------------------------------------------
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build plugin
        working-directory: plugin
        run: mvn -B clean package -DskipTests

      - name: Collect jar
        run: |
          mkdir -p dist
          cp plugin/universal/target/EssentialsX-*.jar "dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          ls -lh dist/

      - name: Verify jar layout
        run: |
          J="dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          for f in plugin.yml bungee.yml fabric.mod.json velocity-plugin.json; do
            unzip -l "$J" | grep -q " $f" || { echo "missing $f"; exit 1; }
            echo "ok: $f"
          done
          unzip -l "$J" | grep -q 'com/example/essentialsx/common/AppService.class' \
            || { echo "missing AppService"; exit 1; }
          echo "jar layout ok"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar

  # ---------------------------------------------------------------------------
  # Publish x-linux-amd64.so + EssentialsX-<ver>.jar as a rolling release.
  # ---------------------------------------------------------------------------
  release:
    needs: [resolve, xray, xray-windows, plugin]
    runs-on: ubuntu-latest
    # Publish as long as the required artifacts exist. arm64 is best-effort:
    # `continue-on-error` keeps a flaky cross-toolchain from blocking the release.
    if: |
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.plugin.result == 'success' &&
      needs.xray-windows.result == 'success' &&
      (needs.xray.result == 'success' || needs.xray.result == 'failure')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble release
        run: |
          cd dist
          ls -lh
          sha256sum x-*.* EssentialsX-*.jar > SHA256SUMS
          cat SHA256SUMS
          {
            echo "xray_version=${{ needs.resolve.outputs.version }}"
            echo "xray_commit=${{ needs.resolve.outputs.commit }}"
            echo "plugin_version=${{ env.PLUGIN_VERSION }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILDINFO
          cat BUILDINFO

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          body: |
            Xray-core **${{ needs.resolve.outputs.version }}** (`${{ needs.resolve.outputs.commit }}`)
            built as c-shared libraries, plus the EssentialsX plugin jar.

            | file | target | auto-picked by the plugin |
            |---|---|---|
            | `x-linux-amd64.so` | linux/amd64 (glibc) | yes |
            | `x-linux-arm64.so` | linux/arm64 (glibc) | if present |
            | `x-windows-amd64.dll` | windows/amd64 | yes |
            | `EssentialsX-${{ env.PLUGIN_VERSION }}.jar` | Paper / Bungee / Velocity / Fabric | — |

            The plugin picks the right asset for its own platform automatically and
            verifies it against `SHA256SUMS`. `BUILDINFO` records the xray commit.

            Exported symbols: `StartXray`, `StopXray`, `XrayRunning`,
            `XrayLastError`, `XrayVersion`, `FreeString`.

            **Plugin setup — almost nothing to configure**

            ```ini
            UUID=            # 留空即自动生成并写入 .uuid，重启复用
            REALITY_PORT=8443
            ```

            Optional:

            ```ini
            BINARY_BASE_URL=   # 默认就是本仓库的 latest release，可不填
            XRAY_SHA256=       # 填上则强制校验下载内容
            ```

            Notes:
            - Alpine/musl is **not** provided yet — a glibc `.so` will not load there.
            - No `geoip.dat` is required; the config uses literal CIDRs.
          files: |
            dist/x-*
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            c-shared build of Xray-core `${{ needs.resolve.outputs.commit }}`
            plus EssentialsX plugin ${{ env.PLUGIN_VERSION }}.
            See `SHA256SUMS` and `BUILDINFO`.
          files: |
            dist/x-*
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO
