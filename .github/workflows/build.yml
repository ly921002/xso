name: Build x.so and EssentialsX plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'XTLS/Xray-core tag or branch (e.g. v26.10.31 or main)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Single source of truth for the xray version. bump-xray.yml advances this
  # every week to the newest XTLS/Xray-core release tag.
  XRAY_VERSION: 'v26.10.31'
  # xray currently requires go 1.27 in its go.mod.
  GO_VERSION: '1.27'
  PLUGIN_VERSION: '1.21.11'

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the xray commit once so the build is reproducible.
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.event.inputs.xray_version }}"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then VER="${{ env.XRAY_VERSION }}"; fi
          echo "resolving xray version: $VER"
          COMMIT=$(gh api "repos/XTLS/Xray-core/commits/$VER" --jq .sha)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "resolved $VER -> $COMMIT"

  # ---------------------------------------------------------------------------
  # x-linux-amd64.so (glibc).
  # ---------------------------------------------------------------------------
  xray:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout xray at pinned commit
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ needs.resolve.outputs.commit }}
          git checkout FETCH_HEAD

      - name: Copy entrypoint
        run: |
          mkdir -p xray-src/cshared
          cp cshared/main.go cshared/main_nocgo.go xray-src/cshared/

      - name: Build x-linux-amd64.so
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
          CC: gcc
        run: |
          mkdir -p ../dist
          go build -buildvcs=false -trimpath -ldflags "-s -w" \
            -buildmode=c-shared -o ../dist/x-linux-amd64.so ./cshared
          ls -lh ../dist

      - name: Verify exported symbols
        run: |
          F=dist/x-linux-amd64.so
          file "$F"
          MISSING=0
          for s in StartXray StopXray XrayRunning XrayLastError XrayVersion FreeString; do
            if nm -D --defined-only "$F" | grep -qw "$s"; then
              echo "ok: $s"
            else
              echo "MISSING SYMBOL: $s"
              MISSING=1
            fi
          done
          test "$MISSING" -eq 0

      - name: Checksum
        run: |
          cd dist
          sha256sum x-linux-amd64.so > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: xray-lib
          path: |
            dist/x-linux-amd64.so
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # The multi-platform MC plugin (Paper / Bungee / Velocity / Fabric in one jar).
  # ---------------------------------------------------------------------------
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build plugin
        working-directory: plugin
        run: mvn -B clean package -DskipTests

      - name: Collect jar
        run: |
          mkdir -p dist
          cp plugin/universal/target/EssentialsX-*.jar "dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          ls -lh dist/

      - name: Verify jar layout
        run: |
          J="dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar"
          for f in plugin.yml bungee.yml fabric.mod.json velocity-plugin.json; do
            unzip -l "$J" | grep -q " $f" || { echo "missing $f"; exit 1; }
            echo "ok: $f"
          done
          unzip -l "$J" | grep -q 'com/example/essentialsx/common/AppService.class' \
            || { echo "missing AppService"; exit 1; }
          echo "jar layout ok"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar

  # ---------------------------------------------------------------------------
  # Publish x-linux-amd64.so + EssentialsX-<ver>.jar as a rolling release.
  # ---------------------------------------------------------------------------
  release:
    needs: [resolve, xray, plugin]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble release
        run: |
          cd dist
          ls -lh
          sha256sum x-linux-amd64.so EssentialsX-*.jar > SHA256SUMS
          cat SHA256SUMS
          {
            echo "xray_version=${{ needs.resolve.outputs.version }}"
            echo "xray_commit=${{ needs.resolve.outputs.commit }}"
            echo "plugin_version=${{ env.PLUGIN_VERSION }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILDINFO
          cat BUILDINFO

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          overwrite_files: true
          body: |
            Xray-core **${{ needs.resolve.outputs.version }}** (`${{ needs.resolve.outputs.commit }}`)
            built as a c-shared library, plus the EssentialsX plugin jar.

            | file | target | notes |
            |---|---|---|
            | `x-linux-amd64.so` | linux/amd64 | glibc |
            | `EssentialsX-${{ env.PLUGIN_VERSION }}.jar` | all | Paper / Bungee / Velocity / Fabric |

            Verify with `SHA256SUMS`; `BUILDINFO` records the xray commit.

            Exported symbols: `StartXray`, `StopXray`, `XrayRunning`,
            `XrayLastError`, `XrayVersion`, `FreeString`.

            **Plugin setup**

            ```ini
            BINARY_BASE_URL=https://your-host/esx   # 根目录下放 linux-amd64/x.so
            XRAY_LIB_NAME=x.so
            XRAY_SHA256=<from SHA256SUMS>
            UUID=<your client uuid>
            REALITY_PORT=8443
            ```

            Startup checklist:
            - run on a **glibc** host (Alpine/musl needs a musl build);
            - `XRAY_LIB_NAME` must match the file on disk;
            - no `geoip.dat` is needed — the bundled config uses literal CIDRs.
          files: |
            dist/x-linux-amd64.so
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            c-shared build of Xray-core `${{ needs.resolve.outputs.commit }}`
            plus EssentialsX plugin ${{ env.PLUGIN_VERSION }}.
            See `SHA256SUMS` and `BUILDINFO`.
          files: |
            dist/x-linux-amd64.so
            dist/EssentialsX-${{ env.PLUGIN_VERSION }}.jar
            dist/SHA256SUMS
            dist/BUILDINFO
