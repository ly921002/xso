name: Weekly xray bump

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # needed for `gh workflow run` to re-trigger the build
  # NOTE: `workflows` is NOT a valid key under `permissions`. GitHub rejects
  # the workflow file outright ("Unexpected value 'workflows'"). A repo-scoped
  # PAT stored as secret BUMP_TOKEN is what actually permits pushing changes
  # to .github/workflows/; see the checkout step's token: below.

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is a GitHub App and cannot push workflow-file changes
          # ("refusing to allow a GitHub App to create or update workflow").
          # A classic PAT with `repo` + `workflow` scope can. Storing it in the
          # checkout step makes the subsequent `git push` use it too.
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Resolve latest xray release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)
          echo "latest xray release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update pinned version
        id: update
        run: |
          CURRENT=$(grep -oP "XRAY_VERSION: '\K[^']+" .github/workflows/build.yml || true)
          echo "pinned now: $CURRENT"
          if [ "$CURRENT" = "${{ steps.latest.outputs.tag }}" ]; then
            echo "already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            sed -i "s/XRAY_VERSION: '.*'/XRAY_VERSION: '${{ steps.latest.outputs.tag }}'/" .github/workflows/build.yml
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "bumped $CURRENT -> ${{ steps.latest.outputs.tag }}"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git commit -m "chore: bump xray to ${{ steps.latest.outputs.tag }}"
          git push

      - name: Trigger build workflow
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml -f xray_version="${{ steps.latest.outputs.tag }}"
