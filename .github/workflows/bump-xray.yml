name: Weekly xray bump

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # needed for `gh workflow run` to re-trigger the builds

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest xray release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)
          echo "latest xray release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update pinned version
        id: update
        run: |
          CURRENT=$(tr -d '[:space:]' < config/xray-version.txt || true)
          echo "pinned now: $CURRENT"
          if [ "$CURRENT" = "${{ steps.latest.outputs.tag }}" ]; then
            echo "already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${{ steps.latest.outputs.tag }}" > config/xray-version.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "bumped $CURRENT -> ${{ steps.latest.outputs.tag }}"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/xray-version.txt
          git commit -m "chore: bump xray to ${{ steps.latest.outputs.tag }}"
          git push

      - name: Trigger build workflow
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not start new workflow runs
          # (GitHub's recursion guard), so both builds are triggered by hand.
          gh workflow run build.yml -f xray_version="${{ steps.latest.outputs.tag }}"
          gh workflow run docker.yml
