name: PortProbe tests

on:
  push:
    branches: [main, feature/standalone-entry]
    paths:
      - 'plugin/portprobe/**'
      - '.github/workflows/portprobe.yml'
      - '.github/scripts/held_port_check.py'
  pull_request:
    paths:
      - 'plugin/portprobe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: plugin
        run: mvn -B -pl portprobe -am package -DskipTests

      - name: Check jar layout
        run: |
          J=plugin/portprobe/target/PortProbe-1.21.11.jar
          test -s "$J" || { echo "jar missing"; exit 1; }
          unzip -l "$J" | grep -q 'plugin.yml' || { echo "no plugin.yml"; exit 1; }
          unzip -l "$J" | grep -q 'PortScanner.class' || { echo "no PortScanner"; exit 1; }
          # The probe must stay independent of the proxy code.
          if unzip -l "$J" | grep -q 'com/example/essentialsx/common/'; then
            echo "::error::portprobe must not depend on essentialsx-common"
            exit 1
          fi

      - name: Curated scan finds free ports
        run: |
          set -euo pipefail
          J=plugin/portprobe/target/PortProbe-1.21.11.jar
          java -cp "$J" com.example.essentialsx.portprobe.PortScanner | tee out.txt
          # A CI runner has many free ports; zero would mean the probe is broken.
          grep -qE 'free: [1-9]' out.txt || { echo "::error::no free ports found"; exit 1; }

      - name: Occupied port is excluded
        run: python3 .github/scripts/held_port_check.py plugin/portprobe/target/PortProbe-1.21.11.jar 8443

      - name: UDP mode runs
        run: |
          J=plugin/portprobe/target/PortProbe-1.21.11.jar
          java -cp "$J" com.example.essentialsx.portprobe.PortScanner udp | tail -5

      - name: Full range completes
        run: |
          J=plugin/portprobe/target/PortProbe-1.21.11.jar
          timeout 600 java -cp "$J" com.example.essentialsx.portprobe.PortScanner tcp full | tail -6
