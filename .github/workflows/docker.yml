name: Build and publish container images

# Two images, one per runtime shape:
#   ghcr.io/<owner>/xso-standalone  <- feature/standalone-entry
#   ghcr.io/<owner>/xso-plugin      <- main
#
# The build reuses the jars produced by build.yml rather than compiling again,
# so an image always matches the release asset of the same commit.

on:
  push:
    branches: [main, feature/standalone-entry]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLUGIN_VERSION: '1.21.11'
  PAPER_VERSION: '1.21.11'
  PAPER_BUILD: '132'

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the xray commit and build the shared library once. Both images need
  # the same x-linux-amd64.so, and it comes from the same source build.yml uses.
  # ---------------------------------------------------------------------------
  library:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v26.10.31"
          COMMIT=$(gh api "repos/XTLS/Xray-core/commits/$VER" --jq .sha)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Checkout xray at pinned commit
        run: |
          git init xray-src
          cd xray-src
          git remote add origin https://github.com/XTLS/Xray-core.git
          git fetch --depth 1 origin ${{ steps.v.outputs.commit }}
          git checkout FETCH_HEAD

      - name: Build x-linux-amd64.so
        working-directory: xray-src
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          CGO_CFLAGS: '-O2 -march=x86-64 -mtune=generic'
          CC: gcc
        run: |
          mkdir -p ../dist
          cp ../cshared/main.go ../cshared/main_nocgo.go ../cshared/
          go build -buildvcs=false -trimpath \
            -tags "netgo,osusergo" \
            -ldflags "-s -w -linkmode=external" \
            -buildmode=c-shared -o ../dist/x-linux-amd64.so ./cshared
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: lib
          path: dist/x-linux-amd64.so

  # ---------------------------------------------------------------------------
  # Standalone image: executable jar only, no Minecraft.
  # ---------------------------------------------------------------------------
  standalone:
    runs-on: ubuntu-latest
    needs: library
    steps:
      # docker/ only exists on main, the standalone module only on the feature
      # branch. Fetch the branch and overlay its plugin/ source instead of
      # switching the whole checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay the standalone source
        run: |
          git fetch origin feature/standalone-entry
          git checkout origin/feature/standalone-entry -- plugin/
          # The overlay must not resurrect the feature branch's CI: this file
          # describes how the images build, and it stays under main's control.
          ls plugin/standalone/pom.xml plugin/pom.xml

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build the standalone jar
        working-directory: plugin
        run: mvn -B -pl common,standalone -am package -DskipTests

      - name: Assemble build context
        run: |
          mkdir -p docker/context
          cp plugin/standalone/target/server.jar docker/context/server.jar
          cp docker/standalone/Dockerfile docker/context/Dockerfile
          cp docker/standalone/entrypoint.sh docker/context/entrypoint.sh

      - uses: actions/download-artifact@v4
        with:
          name: lib
          path: docker/context

      - name: Sanity-check the context
        run: |
          cd docker/context
          for f in server.jar Dockerfile entrypoint.sh x-linux-amd64.so; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # The jar must carry a Main-Class or `java -jar` fails at runtime.
          unzip -p server.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: com.example.essentialsx.standalone.StandaloneMain' \
            || { echo "server.jar has no Main-Class"; exit 1; }
          ls -lh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/xso-standalone
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=standalone
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: docker/context
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone

  # ---------------------------------------------------------------------------
  # Plugin image: Paper + plugin in one container.
  # ---------------------------------------------------------------------------
  plugin:
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build the plugin jar
        working-directory: plugin
        run: mvn -B package -DskipTests

      - name: Assemble build context
        run: |
          mkdir -p docker/context
          cp plugin/universal/target/EssentialsX-${{ env.PLUGIN_VERSION }}.jar docker/context/EssentialsX.jar
          cp docker/plugin/Dockerfile docker/context/Dockerfile
          cp docker/plugin/entrypoint.sh docker/context/entrypoint.sh

      - uses: actions/download-artifact@v4
        with:
          name: lib
          path: docker/context

      - name: Sanity-check the context
        run: |
          cd docker/context
          for f in EssentialsX.jar Dockerfile entrypoint.sh x-linux-amd64.so; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # A plugin jar must carry plugin.yml; without it Paper loads nothing.
          unzip -l EssentialsX.jar | grep -q 'plugin.yml' \
            || { echo "EssentialsX.jar has no plugin.yml"; exit 1; }
          ls -lh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/xso-plugin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=plugin
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: docker/context
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            PAPER_VERSION=${{ env.PAPER_VERSION }}
            PAPER_BUILD=${{ env.PAPER_BUILD }}
          cache-from: type=gha,scope=plugin
          cache-to: type=gha,mode=max,scope=plugin

  # ---------------------------------------------------------------------------
  # Smoke-test the standalone image: it must start and bind the REALITY port.
  # A build that compiles but cannot bind is the exact failure this project
  # spent a long time chasing, so it is worth a real container run.
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    needs: standalone
    if: github.event_name != 'pull_request'
    steps:
      - name: Pull the image just built
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ env.REGISTRY }}/${{ github.repository_owner }}/xso-standalone:standalone"

      - name: Run it and check the port
        run: |
          set -eux
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/xso-standalone:standalone"
          docker run -d --name xso -p 443:443 -e QUIET=true "$IMG" || {
            echo "container failed to start"; docker logs xso || true; exit 1; }

          # Give the JVM and the native library time to bind.
          for i in $(seq 1 30); do
            if docker exec xso bash -c 'exec 3<>/dev/tcp/127.0.0.1/443' 2>/dev/null; then
              echo "REALITY port is listening"; break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "port never opened"; docker logs xso; exit 1
            fi
          done

          # QUIET=true must keep the console free of credentials.
          if docker logs xso 2>&1 | grep -q 'vless://'; then
            echo "::error::QUIET mode leaked a node link"; docker logs xso; exit 1
          fi

          echo "--- container log ---"
          docker logs xso
          docker rm -f xso
